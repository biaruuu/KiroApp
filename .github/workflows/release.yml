name: Release

# Publishes a GitHub release with the APK and the matching CHANGELOG.md section as notes.
#
# Triggers:
#  - push to main: if the versionName in app/build.gradle.kts has no release yet, one is created
#    (so bumping the version + adding a changelog entry is all it takes)
#  - push of a tag like v1.0.0
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this version
        if: steps.version.outputs.exists == 'false'
        run: bash scripts/release-notes.sh "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.exists == 'false'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: taiki-e/install-action@v2
        if: steps.version.outputs.exists == 'false'
        with:
          tool: cargo-ndk

      - name: Build Rust core
        if: steps.version.outputs.exists == 'false'
        run: bash scripts/build-rust.sh

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'

      - name: Build release APK
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        if: steps.version.outputs.exists == 'false'
        run: cp app/build/outputs/apk/release/app-release.apk "Kiro-${{ steps.version.outputs.version }}.apk"

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Kiro v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: Kiro-${{ steps.version.outputs.version }}.apk
